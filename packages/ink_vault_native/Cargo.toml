[package]
name = "ink_vault_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "=1.0.154"
regex = "=1.13.1"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"
pulldown-cmark = { version = "=0.13.5", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
crc32fast = "=1.5.3"
flate2 = "=1.1.10"
roxmltree = "=0.21.2"
tempfile = "=3.27.0"

[profile.release]
lto = true
strip = "debuginfo"

