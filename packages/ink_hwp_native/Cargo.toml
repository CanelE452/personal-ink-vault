[package]
name = "ink_hwp_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "GPL-3.0-only"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
cfb = "=0.14.0"
jni-sys = "=0.3.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
quick-xml = "=0.41.0"
unicode-segmentation = "=1.13.3"
zip = "=8.6.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
hwp-model = { git = "https://github.com/STAIxBWLB/hwp-cli", rev = "4e6e8c2a61694899e37b4f7c2f97523153a623b9" }
hwp5 = { git = "https://github.com/STAIxBWLB/hwp-cli", rev = "4e6e8c2a61694899e37b4f7c2f97523153a623b9" }
hwpx = { git = "https://github.com/STAIxBWLB/hwp-cli", rev = "4e6e8c2a61694899e37b4f7c2f97523153a623b9" }
hwp-render = { git = "https://github.com/STAIxBWLB/hwp-cli", rev = "4e6e8c2a61694899e37b4f7c2f97523153a623b9" }
hwp-convert = { git = "https://github.com/STAIxBWLB/hwp-cli", rev = "4e6e8c2a61694899e37b4f7c2f97523153a623b9" }
rhwp = { version = "=0.9.0", default-features = false }
[dev-dependencies]
tempfile = "=3.27.0"
# Temporary (2026-11-14): rhwp from upstream devel + PR #9022 (refs/pull/9022/head, commit 4cf97fe5) instead of
# crates.io 0.9.0. It fixes square-wrap pictures in table cells without stored line segments (text drawn over or
# hidden under the picture). The pinned source and its provenance (SOURCE.json) are in the folder below.
# Remove this section when a released rhwp includes #9022, and pin that release above.
[patch.crates-io]
rhwp = { path = "E:/CodexBuilds/rhwp-src/rhwp-0.9.0-dev-4cf97fe5" }
[profile.release]
lto = "thin"
strip = "debuginfo"
[profile.dev]
debug = 0
